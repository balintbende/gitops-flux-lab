apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.web.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.web.serviceName }}
    helm.sh/chart: {{ include "bimlens.chart" . }}
    app.kubernetes.io/instance: {{ .Values.web.serviceName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  {{- with .Values.web.host }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.web.serviceName }}
          port: {{ .Values.web.port }}
