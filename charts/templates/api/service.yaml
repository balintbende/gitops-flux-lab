apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.api.serviceName }}
    helm.sh/chart: {{ include "bimlens.chart" . }}
    app.kubernetes.io/instance: {{ .Values.api.serviceName }}
    app.kubernetes.io/managed-by: {{ .Values.api.serviceName }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.api.port }}
      targetPort: 8080
      protocol: TCP
      name: "public-api"
  selector:
    app.kubernetes.io/name: {{ .Values.api.serviceName }}
    app.kubernetes.io/instance: {{ .Values.api.serviceName }}
